[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PIdata"
version = "0.4.0"
authors = [
  { name="Venanzio Petrarolo", email="petrarolov@gmail.com" },
  { name="Trey Belleu", email="william.belleu@shell.com" }
]
description = "An easy-to-use connector for the OSI PI historian with bulk retrieval support"
readme = "README.md"
requires-python = ">=3.7"
keywords = [
    "OSI", 
    "PI", 
    "Connector", 
    "Historian", 
    "Process", 
    "Control", 
    "Automation", 
    "Engineering",
    "Bulk",
    "Performance"
]
dependencies = [
    "pythonnet>=3.0.3",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.2",
    "pyarrow>=15.0.0",
    "tqdm>=4.66.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
benchmark = [
    "fastparquet>=2024.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/Petrarolo/PIdata"
Issues = "https://github.com/Petrarolo/PIdata/issues"
Documentation = "https://github.com/Petrarolo/PIdata#readme"

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
